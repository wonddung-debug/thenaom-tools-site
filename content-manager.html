<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>콘텐츠 보관함</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1a1a1a;--sub:#666;--line:#dcdcd6;--accent:#2f6fed;--accentbg:#eef4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",Arial,sans-serif;line-height:1.5}
main{max-width:1120px;margin:0 auto;padding:18px 14px 50px}h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0;font-weight:750}.muted{font-size:13px;color:var(--sub)}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);padding:8px 12px;cursor:pointer;font-weight:650}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.danger{color:#b42318}button:disabled{opacity:.5;cursor:not-allowed}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.layout{display:block}.content-entry{display:block;margin:0 0 9px}.detail-panel{margin:2px 0 18px;padding:14px;background:var(--bg);border:1px solid var(--line);border-radius:11px}.content-list{display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;min-width:0}.search{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;margin:10px 0;background:var(--bg);color:var(--ink)}.item{display:block;text-align:left;width:100%;margin:7px 0;padding:11px 34px 11px 11px;background:var(--panel);font-weight:500}.item{position:relative}.item::after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%) rotate(-90deg);color:var(--sub);transition:transform .15s}.item.active{border-color:var(--accent);background:var(--accentbg)}.item.active::after{transform:translateY(-50%) rotate(0);color:var(--accent)}.item strong{display:block;font-size:14px;margin-bottom:3px}.item small{display:block;font-size:12px;color:var(--sub)}.empty{padding:20px 6px;color:var(--sub);font-size:13px}.field{margin:10px 0 16px}.field-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.field-head label{font-size:13px;font-weight:750}.field-head button{flex-shrink:0;padding:6px 11px;font-size:12px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}textarea{min-height:140px;resize:vertical;line-height:1.55}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.detail-head{display:flex;justify-content:space-between;align-items:start;gap:10px;flex-wrap:wrap}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:18px}.status{margin:10px 0;color:var(--accent);font-size:13px;font-weight:700;white-space:pre-wrap}.hidden{display:none!important}.image-list{display:flex;flex-direction:column;gap:8px}.image-item{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0}.image-item a{color:var(--accent);font-size:13px;overflow-wrap:anywhere}.image-item button{flex-shrink:0;font-size:12px;padding:6px 9px}.hint{font-size:12px;color:var(--sub);margin:8px 0 0}.project-label{display:inline-block;margin:5px 0 8px;padding:4px 8px;border-radius:6px;background:var(--accentbg);color:var(--accent);font-size:12px;font-weight:750}
.uid-bar{margin:34px auto 6px;text-align:center}.uid-bar.need{padding:10px;border:1px dashed var(--accent);border-radius:10px;background:var(--accentbg)}.uid-bar .uid-tag{background:none;border:0;padding:6px 10px;font-size:11px;font-weight:500;color:var(--sub);opacity:.2;cursor:pointer}.uid-bar .uid-tag:hover{opacity:.7}.uid-form{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}.uid-form span{font-size:12.5px;color:var(--sub);font-weight:650}.uid-form input{width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}.owner-tag{color:var(--accent)}
@media(max-width:760px){main{padding:13px 10px 40px}.detail-panel{padding:10px}}@media(max-width:430px){.image-item{align-items:flex-start}.image-item button{white-space:nowrap}}
</style>
</head>
<body>
<main>
  <div class="head">
    <div><h1>콘텐츠 보관함</h1><div class="muted">프로젝트별 원문·이미지·게시글 문구를 한곳에서 관리합니다.</div></div>
    <div class="row"><button id="refreshBtn">목록 새로고침</button><button type="button" onclick="window.location.href='card.html'">이미지 메이커로 돌아가기</button></div>
  </div>
  <div id="status" class="status"></div>
  <div class="layout">
    <section class="panel">
      <h2>저장된 콘텐츠</h2>
      <input class="search" id="search" type="text" placeholder="제목 또는 프로젝트명 검색">
      <div id="contentList" class="empty">저장 목록을 불러오는 중입니다.</div>
    </section>
  </div>
  <div id="noSelection" class="hidden"></div>
  <div id="detail" class="hidden detail-panel">
    <div class="detail-head">
      <div><h2 id="detailTitle"></h2><div id="projectLabel" class="project-label"></div><div id="detailMeta" class="muted"></div></div>
      <div class="row"><button id="deleteBtn" class="danger">콘텐츠 삭제</button></div>
    </div>
    <div class="section">
      <div class="field-head"><label for="rawText">원문</label><button type="button" id="copyRawBtn">복사</button></div>
      <textarea id="rawText" readonly></textarea>
    </div>
    <div id="fixedFields"></div>
    <div class="section" id="imagesSection">
      <h2>이미지 링크</h2>
      <div id="imageList" class="image-list" style="margin-top:10px"></div>
    </div>
  </div>
  <!-- 내 아이디 (하단): 입력하면 이후에는 아주 작게만 표시됩니다 -->
  <div class="uid-bar" id="uidBar"></div>
</main>
<script>
/* ★ 웹 앱 URL(…/exec)을 여기에 붙여 넣고 올리면, 다른 사람들은 URL을 따로 입력하지 않아도 됩니다. */
const DEFAULT_ENDPOINT = "https://script.google.com/macros/s/AKfycbwQtPzfIsBXg35L73JXeZtmOBG8BIEr4p8eY3YNBIPpMm4InReoFifpLu3-i8mHECreFg/exec";
const ENDPOINT_KEY = "card_content_db_endpoint_v1";
const USER_ID_KEY = "card_user_id_v1";
const CACHE_KEY = "card_content_list_cache_v1";
const FIXED_FIELDS = [
  {kind:"youtube_description", label:"유튜브 설명", multi:true},
  {kind:"instagram_caption", label:"인스타그램 설명", multi:true},
  {kind:"coupang_description", label:"쿠파스 설명", multi:true},
  {kind:"coupang_link", label:"쿠파스 링크", multi:false}
];
let allContents = [], selected = null, fieldValues = {}, legacyPosts = [], isAdmin = false;
let autoSaveTimer = null;
let pendingAutoSaveSnapshot = null;
let autoSaveQueue = Promise.resolve();
let autoSaveVersion = 0;
let autoSaveInFlight = 0;
const $ = id => document.getElementById(id);
const mainEl = document.querySelector("main");
// 상세 화면 요소는 처음에 한 번만 잡아 둡니다.
// (목록을 다시 그릴 때 이 요소가 목록 안에 들어 있으면 같이 지워져 버리는 것이 "목록이 사라지는" 원인이었습니다.)
const detailEl = $("detail");
const listHost = $("contentList");
let entryMap = new Map();
function getUserId(){
  try{return (localStorage.getItem(USER_ID_KEY)||"").trim()}catch(e){return ""}
}
function getConfig(){
  let endpoint=(DEFAULT_ENDPOINT||"").trim();
  if(!endpoint){try{endpoint=localStorage.getItem(ENDPOINT_KEY)||""}catch(e){}}
  if(!endpoint){endpoint=(prompt("Google Apps Script 웹 앱 URL을 입력하세요:")||"").trim();if(!endpoint)return null;try{localStorage.setItem(ENDPOINT_KEY,endpoint)}catch(e){}}
  return {endpoint,userId:getUserId()};
}
function callDb(payload){
 const config=getConfig();if(!config)return Promise.reject(new Error("웹 앱 URL 입력이 취소되었습니다."));
 if(!config.userId)return Promise.reject(new Error("아이디가 없습니다. 페이지 맨 아래에 아이디를 입력하세요."));
 payload.userId=config.userId;
 return new Promise((resolve,reject)=>{
  const requestId="manager_"+Date.now()+"_"+Math.random().toString(36).slice(2);payload.requestId=requestId;
  const frameName="cardDbManagerFrame_"+requestId.replace(/[^a-zA-Z0-9_]/g,"");
  const iframe=document.createElement("iframe");iframe.name=frameName;iframe.style.cssText="position:absolute;width:1px;height:1px;left:-9999px;border:0";iframe.setAttribute("aria-hidden","true");
  const form=document.createElement("form");form.method="POST";form.action=config.endpoint;form.target=frameName;form.style.display="none";
  const input=document.createElement("input");input.type="hidden";input.name="payload";input.value=JSON.stringify(payload);form.appendChild(input);
  let done=false;const cleanup=()=>{window.removeEventListener("message",onMessage);form.remove();iframe.remove();clearTimeout(timer)};
  const finish=(fn,val)=>{if(done)return;done=true;cleanup();fn(val)};
  const onMessage=e=>{
   const d=e.data;if(!d||d.type!=="CARD_DB_RESPONSE"||d.requestId!==requestId)return;
   finish(resolve,d.result||{});
  };
  window.addEventListener("message",onMessage);const timer=setTimeout(()=>finish(reject,new Error("응답 시간이 초과되었습니다. Apps Script 배포 권한과 웹 앱 URL을 확인하세요.")),45000);
  document.body.append(iframe,form);try{form.submit()}catch(err){finish(reject,err)}
 });
}
function setStatus(t){$("status").textContent=t||""}

/* ---------- 목록 캐시: 열자마자 지난번 목록을 보여 주고 뒤에서 최신 목록을 확인합니다 ---------- */
function cacheKey(){return CACHE_KEY+"_"+getUserId().toLowerCase()}
function readCache(){
  if(!getUserId())return null;
  try{const v=JSON.parse(localStorage.getItem(cacheKey())||"null");return v&&Array.isArray(v.contents)?v:null}catch(e){return null}
}
function writeCache(){
  if(!getUserId())return;
  try{localStorage.setItem(cacheKey(),JSON.stringify({savedAt:Date.now(),isAdmin:isAdmin,contents:allContents}))}catch(e){/* 용량 초과 등은 무시 */}
}
// 검색용 문자열을 한 번만 만들어 둡니다(저장되는 데이터에는 포함되지 않게 비열거 속성으로).
function prepContents(list){
  list.forEach(x=>{Object.defineProperty(x,"_q",{value:`${x.title||""} ${x.channel||""} ${x.rawText||""} ${x.ownerId||""}`.toLowerCase(),writable:true,enumerable:false,configurable:true})});
  return list;
}

/* ---------- 목록 / 상세 펼침 ---------- */
function parkDetail(){ if(detailEl.parentNode!==mainEl) mainEl.appendChild(detailEl); }

function renderList(){
 parkDetail(); // 목록을 비우기 전에 상세 화면을 안전한 곳으로 옮깁니다.
 const q=$("search").value.trim().toLowerCase();
 listHost.textContent="";entryMap=new Map();
 const filtered=q?allContents.filter(x=>(x._q||"").includes(q)):allContents;
 if(!filtered.length){
  listHost.className="empty";
  listHost.textContent=allContents.length?"검색 결과가 없습니다.":"아직 보관된 콘텐츠가 없습니다. 이미지 메이커에서 ‘콘텐츠 보관’을 눌러 주세요.";
  syncSelection();return;
 }
 listHost.className="content-list";
 const frag=document.createDocumentFragment();
 filtered.forEach(item=>{
  const entry=document.createElement("div");entry.className="content-entry";
  const b=document.createElement("button");b.type="button";b.className="item";b.setAttribute("aria-expanded","false");
  const s=document.createElement("strong");s.textContent=item.title||"제목 없음";
  const sm=document.createElement("small");sm.textContent=`프로젝트: ${item.channel||"미지정"} · ${(item.images||[]).length}장 · ${formatDate(item.createdAt)}`+(isAdmin?` · 아이디: ${item.ownerId||"(주인 없음)"}`:"");
  b.append(s,sm);b.onclick=()=>toggleContent(item.id);
  entry.appendChild(b);frag.appendChild(entry);entryMap.set(item.id,entry);
 });
 listHost.appendChild(frag);
 syncSelection();
}
// 목록을 다시 그리지 않고 선택 표시와 상세 화면 위치만 맞춥니다.
function syncSelection(){
 entryMap.forEach((entry,id)=>{
  const on=!!selected&&selected.id===id,b=entry.firstElementChild;
  b.classList.toggle("active",on);b.setAttribute("aria-expanded",on?"true":"false");
 });
 const entry=selected?entryMap.get(selected.id):null;
 if(entry){entry.appendChild(detailEl);detailEl.classList.remove("hidden")}
 else{parkDetail();detailEl.classList.add("hidden")}
}
function formatDate(v){if(!v)return"날짜 미상";const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleString("ko-KR")}
function extractField(posts,kind){
 let entries=(posts||[]).filter(p=>p&&p.kind===kind);
 if(kind==="coupang_description")entries=entries.concat((posts||[]).filter(p=>p&&p.kind==="coupang_comment"));
 const vals=entries.map(p=>kind==="coupang_link"?(p.content||p.link||""):(p.content||"")).map(s=>String(s).trim()).filter(Boolean);
 return [...new Set(vals)].join("\n\n");
}
function toggleContent(id){
 // 열려 있는 항목을 다시 누르면 닫습니다.
 if(selected&&selected.id===id)closeContent();else openContent(id);
}
function closeContent(){
 flushPendingAutoSave();
 selected=null;
 syncSelection();
}
function fillDetail(){
 $("detailTitle").textContent=selected.title||"제목 없음";
 $("projectLabel").textContent="프로젝트: "+(selected.channel||"미지정");
 $("detailMeta").textContent=`저장 ${formatDate(selected.createdAt)} · 비율 ${selected.aspectRatio||"미상"}`+(isAdmin?` · 아이디 ${selected.ownerId||"(주인 없음)"}`:"");
 $("rawText").value=selected.rawText||"";
 const allPosts=Array.isArray(selected.posts)?selected.posts:[];
 const managedKinds=new Set(FIXED_FIELDS.map(x=>x.kind).concat(["coupang_comment"]));
 legacyPosts=allPosts.filter(p=>p&&!managedKinds.has(p.kind)).map(p=>({...p}));
 fieldValues={};FIXED_FIELDS.forEach(f=>fieldValues[f.kind]=extractField(allPosts,f.kind));
 renderImages();renderFixedFields();
}
function openContent(id){
 // 다른 콘텐츠로 이동하기 전에 입력 중인 내용이 있으면 자동 저장 큐에 넣습니다.
 flushPendingAutoSave();
 const item=allContents.find(x=>x.id===id);
 if(!item){selected=null;syncSelection();return}
 selected=item;
 fillDetail();
 syncSelection();
 const entry=entryMap.get(id);
 if(entry&&entry.scrollIntoView)entry.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function renderImages(){
 const host=$("imageList");host.textContent="";const images=selected&&Array.isArray(selected.images)?selected.images:[];
 if(!images.length){host.className="empty";host.textContent="저장된 이미지가 없습니다.";return}host.className="image-list";
 images.forEach((img,i)=>{
  const row=document.createElement("div");row.className="image-item";
  const link=document.createElement("a");link.href=img.url||"#";link.target="_blank";link.rel="noopener";link.textContent=`${String(i+1).padStart(2,"0")} · ${img.name||"카드 이미지"} · 이미지 열기 ↗`;
  const copy=document.createElement("button");copy.type="button";copy.textContent="링크 복사";copy.onclick=()=>copyText(img.url||"");row.append(link,copy);host.appendChild(row);
 });
}
function renderFixedFields(){
 const host=$("fixedFields");host.textContent="";
 FIXED_FIELDS.forEach(f=>{
  const wrap=document.createElement("div");wrap.className="field section";
  const head=document.createElement("div");head.className="field-head";
  const label=document.createElement("label");label.textContent=f.label;label.htmlFor="field_"+f.kind;
  const copy=document.createElement("button");copy.type="button";copy.textContent="복사";copy.onclick=()=>copyText(fieldValues[f.kind]||"");
  head.append(label,copy);wrap.appendChild(head);
  let input;
  if(f.multi){input=document.createElement("textarea");input.placeholder=f.label+" 입력";}
  else{input=document.createElement("input");input.type="text";input.placeholder="쿠파스 링크";}
  input.id="field_"+f.kind;input.value=fieldValues[f.kind]||"";
  input.oninput=()=>{fieldValues[f.kind]=input.value;scheduleAutoSave();};
  input.onblur=()=>flushPendingAutoSave(); // 입력칸을 벗어나면 기다리지 않고 바로 저장
  wrap.appendChild(input);host.appendChild(wrap);
 });
}

/* ---------- 자동 저장 ---------- */
function makeAutoSaveSnapshot(){
 if(!selected)return null;
 const id=selected.id, channel=selected.channel||"";
 const fixedPosts=FIXED_FIELDS.map(f=>({channel,kind:f.kind,content:String(fieldValues[f.kind]||""),link:""}));
 return {id,channel,posts:[...legacyPosts.map(p=>({...p})),...fixedPosts],version:++autoSaveVersion};
}
function hasUnsavedEdits(){return !!(autoSaveTimer||pendingAutoSaveSnapshot||autoSaveInFlight>0)}
function scheduleAutoSave(){
 if(!selected)return;
 pendingAutoSaveSnapshot=makeAutoSaveSnapshot();
 clearTimeout(autoSaveTimer);
 setStatus("자동 저장 대기 중…");
 autoSaveTimer=setTimeout(()=>flushPendingAutoSave(),700);
}
function flushPendingAutoSave(){
 clearTimeout(autoSaveTimer);autoSaveTimer=null;
 const snapshot=pendingAutoSaveSnapshot;
 if(!snapshot)return;
 pendingAutoSaveSnapshot=null;
 autoSaveInFlight++;
 autoSaveQueue=autoSaveQueue.catch(()=>{}).then(()=>persistAutoSave(snapshot)).finally(()=>{autoSaveInFlight--});
}
async function persistAutoSave(snapshot){
 if(selected&&selected.id===snapshot.id)setStatus("자동 저장 중…");
 try{
  const result=await callDb({action:"update",id:snapshot.id,posts:snapshot.posts});
  if(!result||!result.ok)throw new Error(result&&result.error||"자동 저장에 실패했습니다.");
  const saved=allContents.find(x=>x.id===snapshot.id);
  if(saved)saved.posts=snapshot.posts;
  if(selected&&selected.id===snapshot.id){selected.posts=snapshot.posts;
   if(snapshot.version===autoSaveVersion)setStatus("자동 저장됨");
  }
  writeCache();
 }catch(e){if(selected&&selected.id===snapshot.id)setStatus("자동 저장 실패: "+(e.message||e));}
}
async function copyText(text){
 if(!text){setStatus("복사할 내용이 없습니다.");return}
 try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement("textarea");t.value=text;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();const ok=document.execCommand("copy");t.remove();if(!ok){setStatus("복사하지 못했습니다. 텍스트를 직접 선택해 복사해 주세요.");return}}
 setStatus("복사했습니다.");
}

/* ---------- 목록 불러오기 ---------- */
async function loadContents(){
 if(!getUserId()){showNeedId();return}
 const uidAtStart=getUserId();
 setStatus(allContents.length?"최신 목록을 확인하는 중…":"저장 목록을 불러오는 중입니다…");$("refreshBtn").disabled=true;
 try{
  // 저장 중인 수정 내용이 있으면 먼저 서버에 반영시킨 뒤 목록을 받아 옛 내용으로 덮어쓰지 않게 합니다.
  flushPendingAutoSave();await autoSaveQueue.catch(()=>{});
  const result=await callDb({action:"list"});
  if(uidAtStart!==getUserId())return;   // 응답을 기다리는 사이 아이디가 바뀐 경우
  if(!result||!result.ok)throw new Error(result&&result.error||"목록을 읽을 수 없습니다.");
  isAdmin=!!result.isAdmin;
  const fresh=prepContents(Array.isArray(result.contents)?result.contents:[]);
  const prev=selected, prevPostsJson=prev?JSON.stringify(prev.posts||[]):"";
  allContents=fresh;
  let refill=false;
  if(prev){
   const idx=fresh.findIndex(x=>x.id===prev.id);
   if(idx<0){selected=null}                                   // 다른 곳에서 삭제된 경우
   else if(hasUnsavedEdits()){fresh[idx]=prev}                // 지금 입력 중인 내용은 그대로 보호
   else{selected=fresh[idx];refill=JSON.stringify(selected.posts||[])!==prevPostsJson}
  }
  writeCache();
  renderList();
  if(selected&&refill)fillDetail();
  setStatus(`총 ${allContents.length}개 콘텐츠를 불러왔습니다.`+(isAdmin?" (관리자: 모든 아이디의 콘텐츠)":""));
 }catch(e){
  setStatus("불러오기 실패: "+(e.message||e)+(allContents.length?" (이전에 불러온 목록을 표시 중입니다)":""));
  if(!allContents.length){parkDetail();listHost.className="empty";listHost.textContent="목록을 불러오지 못했습니다. 웹 앱 URL, 아이디, 배포 권한을 확인하세요."}
 }
 finally{$("refreshBtn").disabled=false}
}
$("refreshBtn").onclick=()=>loadContents();
let searchTimer=null;
$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(renderList,120)};
$("copyRawBtn").onclick=()=>copyText($("rawText").value);
window.addEventListener("beforeunload",()=>{flushPendingAutoSave();});
$("deleteBtn").onclick=async()=>{
 if(!selected||!confirm(`‘${selected.title}’ 콘텐츠와 연결된 드라이브 이미지 파일을 휴지통으로 이동할까요?`))return;
 const btn=$("deleteBtn"),id=selected.id;btn.disabled=true;
 // 삭제할 항목에 대한 대기 중 자동 저장은 취소합니다.
 if(pendingAutoSaveSnapshot&&pendingAutoSaveSnapshot.id===id){pendingAutoSaveSnapshot=null;clearTimeout(autoSaveTimer);autoSaveTimer=null}
 try{
  await autoSaveQueue.catch(()=>{});
  const result=await callDb({action:"delete",id});
  if(!result||!result.ok)throw new Error(result&&result.error||"삭제하지 못했습니다.");
  // 서버가 삭제를 확인했으므로 목록 전체를 다시 불러오지 않고 화면에서 바로 지웁니다.
  allContents=allContents.filter(x=>x.id!==id);selected=null;
  writeCache();renderList();
  setStatus("콘텐츠를 삭제했습니다.");
 }
 catch(e){setStatus("삭제 실패: "+(e.message||e))}finally{btn.disabled=false}
};

/* ---------- 내 아이디 (페이지 맨 아래) ---------- */
function showNeedId(){
 parkDetail();detailEl.classList.add("hidden");
 listHost.className="empty";listHost.textContent="맨 아래에 아이디를 입력하면 내 콘텐츠가 보입니다.";
 setStatus("");renderUidBar(true,true);
}
function renderUidBar(forceOpen,needHint){
 const bar=$("uidBar");bar.textContent="";bar.classList.toggle("need",!!needHint);
 const uid=getUserId();
 if(uid&&!forceOpen){
  const tag=document.createElement("button");tag.type="button";tag.className="uid-tag";tag.textContent="id · "+uid;tag.title="아이디 변경";
  tag.onclick=()=>renderUidBar(true);bar.appendChild(tag);return;
 }
 const form=document.createElement("div");form.className="uid-form";
 const lbl=document.createElement("span");lbl.textContent="내 아이디";
 const input=document.createElement("input");input.type="text";input.id="uidInput";input.maxLength=40;input.value=uid;input.placeholder="아이디 입력";input.autocomplete="off";input.autocapitalize="off";
 const ok=document.createElement("button");ok.type="button";ok.textContent="확인";
 const submit=()=>{if(input.value.trim())submitUserId(input.value);else if(uid)submitUserId("")};
 ok.onclick=submit;input.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();submit()}};
 form.append(lbl,input,ok);
 if(uid){const cancel=document.createElement("button");cancel.type="button";cancel.textContent="취소";cancel.onclick=()=>renderUidBar(false);form.appendChild(cancel)}
 bar.appendChild(form);
}
async function submitUserId(raw){
 const id=String(raw||"").replace(/\s+/g," ").trim().slice(0,40);
 // 이전 아이디로 입력 중이던 내용은 먼저 저장을 끝내고 바꿉니다.
 flushPendingAutoSave();await autoSaveQueue.catch(()=>{});
 try{if(id)localStorage.setItem(USER_ID_KEY,id);else localStorage.removeItem(USER_ID_KEY)}catch(e){}
 switchUser();
}
function switchUser(){
 selected=null;allContents=[];isAdmin=false;fieldValues={};legacyPosts=[];
 renderUidBar(false);
 if(!getUserId()){showNeedId();return}
 const c=readCache();
 if(c){allContents=prepContents(c.contents);isAdmin=!!c.isAdmin;renderList()}
 else{parkDetail();detailEl.classList.add("hidden");listHost.className="empty";listHost.textContent="저장 목록을 불러오는 중입니다."}
 loadContents();
}
switchUser();
</script>
