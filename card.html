<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카드 이미지 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Gothic+A1:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Jua&family=Maru+Buri:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  /* 추가 한글 웹폰트 (눈누 CDN) */
  @font-face {
    font-family: 'RIDIBatang';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_twelve@1.0/RIDIBatang.woff') format('woff');
    font-weight: 400;
  }
  @font-face {
    font-family: 'GmarketSans';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff');
    font-weight: 500;
  }
  @font-face {
    font-family: 'GmarketSans';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff');
    font-weight: 700;
  }
  @font-face {
    font-family: 'S-CoreDream';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-5Medium.woff') format('woff');
    font-weight: 500;
  }
  @font-face {
    font-family: 'S-CoreDream';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/S-CoreDream-7ExtraBold.woff') format('woff');
    font-weight: 700;
  }
  @font-face {
    font-family: 'NanumSquareNeo';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_11-01@1.0/NanumSquareNeo-Variable.woff2') format('woff2');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Cafe24Ssurround';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2105_2@1.0/Cafe24Ssurround.woff') format('woff');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Paperlogy';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Paperlogy';
    src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
    font-weight: 700;
  }

  :root{
    --bg:#f4f4f2; --panel:#ffffff; --ink:#1a1a1a; --sub:#666666; --line:#dcdcd6;
    --btn:#1a1a1a; --btnink:#ffffff; --accent:#2f6fed; --accent-bg:#eef4ff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121212; --panel:#1e1e1e; --ink:#f2f2f2; --sub:#a0a0a0; --line:#343434;
      --btn:#f2f2f2; --btnink:#141414; --accent:#5b91ff; --accent-bg:#1c273d;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Noto Sans KR",sans-serif;
    line-height:1.45; -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:560px; margin:0 auto; padding:12px 14px 60px;}

  /* 최상단 미니 바 */
  .topbar{display:flex; gap:6px; align-items:center; margin-bottom:8px;}
  .topbar select{
    flex:1; padding:10px 10px; font-size:14px; font-weight:600;
    border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink);
  }
  .topbar select.ratio-sel{
    flex:0 0 auto; width:auto; font-size:13px;
  }
  .topbar button{
    width:auto; padding:10px 13px; font-size:14px; font-weight:700;
    border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); cursor:pointer;
    white-space:nowrap;
  }

  /* 원고 나누기 & 마지막 장 방식 선택 줄 */
  .split-box{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:10px; display:flex; flex-direction:column; gap:8px;
  }
  .split-row{display:flex; gap:8px; align-items:center;}
  .split-lbl{font-size:13px; font-weight:700; color:var(--sub); width:68px; flex-shrink:0;}
  .split-row select{flex:1 1 auto; width:auto; min-width:0; padding:8px 10px; font-size:13.5px; font-weight:600; background:var(--bg);}
  .split-row input[type="text"]{flex:0 0 90px; min-width:0; width:90px; padding:8px 10px; font-size:13.5px; background:var(--bg);}

  /* 번호 감지 안내 줄 */
  .num-hint{display:flex; gap:8px; align-items:center; justify-content:space-between; margin:-2px 0 10px; padding:8px 10px; font-size:13px; color:var(--sub); border:1px dashed var(--line); border-radius:8px; background:var(--panel);}
  .num-hint[hidden]{display:none;}

  /* 원고 입력칸 */
  textarea{
    width:100%; min-height:220px; padding:14px; font-size:16px; line-height:1.6;
    border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--ink);
    font-family:inherit; resize:vertical; display:block;
  }

  /* 메인 버튼 */
  button.primary{
    width:100%; padding:15px 16px; font-size:16.5px; font-weight:700; border-radius:12px;
    cursor:pointer; border:1px solid var(--btn); background:var(--btn); color:var(--btnink);
    font-family:inherit;
  }
  button.accent{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.ghost{
    padding:9px 12px; font-size:13px; font-weight:600; border-radius:8px;
    cursor:pointer; background:var(--panel); color:var(--ink); border:1px solid var(--line);
    font-family:inherit;
  }
  button:disabled{opacity:.45; cursor:not-allowed;}

  #make{margin-top:10px;}
  .msg{margin:8px 0 0; font-size:13.5px; font-weight:600; color:var(--accent); text-align:center; min-height:4px;}

  /* 이미지 나열 리스트 */
  .list{display:flex; flex-direction:column; gap:14px; margin-top:12px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px;}
  .card-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:2px 4px 8px; font-size:13.5px; font-weight:700; color:var(--ink);
  }
  .card-head .badge-num{
    display:inline-block; background:var(--accent-bg); color:var(--accent);
    padding:3px 8px; border-radius:6px; font-size:12.5px; margin-right:6px;
  }
  .card-head button{
    padding:5px 10px; font-size:12px; border-radius:6px;
  }
  .card img{
    width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:6px;
    -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto;
  }

  /* 마지막 이미지 아래 저장/공유 버튼 영역 */
  .bottom-actions{
    margin-top:16px; display:flex; flex-direction:column; gap:10px;
  }
  .bottom-actions[hidden]{display:none;}

  /* 설정 모달창 */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200;
    display:none; align-items:flex-start; justify-content:center; overflow-y:auto;
    padding:16px 12px 40px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    width:100%; max-width:560px; background:var(--bg); border-radius:16px;
    border:1px solid var(--line); overflow:hidden; box-shadow:0 12px 32px rgba(0,0,0,0.3);
  }
  .modal-head{
    position:sticky; top:0; z-index:10; background:var(--panel);
    border-bottom:1px solid var(--line); padding:12px 16px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .modal-head strong{font-size:16px;}
  .modal-body{padding:14px;}

  .sec{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px; margin-bottom:12px;
  }
  .sec-title{font-size:14px; font-weight:700; margin:0 0 10px; color:var(--ink);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .grid4{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px;}
  .row-flex{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}

  label.lbl{display:block; font-size:12.5px; font-weight:600; margin:8px 0 4px; color:var(--sub);}
  .sec > label.lbl:first-of-type{margin-top:0;}

  select, input[type="text"], input[type="number"]{
    width:100%; padding:9px 10px; font-size:14px; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); color:var(--ink); font-family:inherit;
  }
  input[type="color"]{
    width:36px; height:36px; padding:2px; border:1px solid var(--line);
    border-radius:8px; background:var(--bg); cursor:pointer;
  }
  .seg{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--bg);}
  .seg button{
    flex:1; padding:8px 4px; font-size:12.5px; font-weight:600; border:none;
    background:transparent; color:var(--sub); cursor:pointer;
  }
  .seg button.active{background:var(--btn); color:var(--btnink);}

  /* 12종 테마 그리드 */
  .themes{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:4px;}
  .theme-btn{
    padding:8px 4px; border-radius:8px; font-size:11.5px; font-weight:700;
    border:2px solid var(--line); cursor:pointer; text-align:center;
  }
  .theme-btn.active{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-bg);}

  label.chk{display:flex; align-items:center; gap:8px; font-size:13.5px; margin:8px 0 0; cursor:pointer;}
  label.chk input{width:18px; height:18px; accent-color:var(--accent);}

  .logo-box{
    display:flex; align-items:center; gap:10px; margin-top:8px; padding:10px;
    border:1px dashed var(--line); border-radius:8px; background:var(--bg);
  }
  .logo-preview{
    width:42px; height:42px; border-radius:50%; object-fit:cover;
    border:1px solid var(--line); background:#fff; display:none;
  }
</style>
</head>
<body>

<div class="wrap">
  <!-- 상단 채널 프리셋 + 비율 선택 + 설정 버튼 -->
  <div class="topbar">
    <select id="presetSel" aria-label="채널 프리셋 선택"></select>
    <select id="aspectRatio" class="ratio-sel" aria-label="이미지 비율">
      <option value="1:1" selected>1:1 (유튜브·인스타)</option>
      <option value="4:5">4:5 (인스타 세로)</option>
    </select>
    <button type="button" id="openSettingsBtn">⚙️ 설정</button>
  </div>

  <!-- 원고 나누기 방식 & 마지막 장 모양 분리 -->
  <div class="split-box">
    <div class="split-row">
      <span class="split-lbl">장 나누기</span>
      <select id="splitMode" aria-label="원고 나누기 방식">
        <option value="blank" selected>빈 줄(엔터 2번)로 구분</option>
        <option value="delim">구분자(---)로 구분</option>
        <option value="number">원고 전체 번호(1. 2. 3.)로 구분</option>
      </select>
      <input type="text" id="splitDelim" value="---" placeholder="구분자" aria-label="구분자" style="display:none;">
    </div>
    <div class="split-row">
      <span class="split-lbl">마지막 장</span>
      <select id="lastPageType" aria-label="마지막 장 레이아웃">
        <option value="auto" selected>자동 감지 (1.2.3. 선택지 또는 VS)</option>
        <option value="choice_box">1. 2. 3. 숫자 선택지 (투표 박스형)</option>
        <option value="choice_clean">1. 2. 3. 숫자 선택지 (깔끔 텍스트형)</option>
        <option value="vs">VS 위/아래 2분할</option>
        <option value="plain">일반 본문 (특수 레이아웃 끔)</option>
      </select>
    </div>
  </div>

  <!-- 번호 감지 안내 줄 -->
  <div class="num-hint" id="numHint" hidden>
    <span id="numHintText"></span>
    <button type="button" class="ghost" id="numHintBtn">전체 번호로 장 나누기</button>
  </div>

  <!-- 원고 입력칸 -->
  <textarea id="src" placeholder="첫 번째 장 내용 (표지)&#10;&#10;두 번째 장 내용 (**강조할 말**)&#10;&#10;여러분의 생각은 어떠신가요?&#10;1. 첫 번째 선택지&#10;2. 두 번째 선택지&#10;3. 세 번째 선택지"></textarea>

  <!-- 바로 아래 이미지 만들기 버튼 -->
  <button type="button" class="primary" id="make">이미지 만들기</button>
  <p class="msg" id="msg"></p>

  <!-- 생성된 이미지 나열 -->
  <div class="list" id="list"></div>

  <!-- 마지막 이미지 바로 아래 저장/공유 버튼 영역 -->
  <div class="bottom-actions" id="bottomActions" hidden>
    <!-- 버튼 하나로 통합 (역순 제거) -->
    <button type="button" class="primary" id="saveAll">모두 저장</button>
    <button type="button" class="primary accent" id="shareAll">한 번에 공유 (인스타·유튜브)</button>
  </div>
</div>

<!-- ⚙️ 설정 모달창 -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-head">
      <strong>⚙️ 디자인 · 채널 설정</strong>
      <div class="row-flex">
        <button type="button" class="ghost accent" id="savePresetBtn">현재 채널에 저장</button>
        <button type="button" class="ghost" id="closeSettingsBtn">닫기 ✕</button>
      </div>
    </div>

    <div class="modal-body">
      <!-- 1. 채널 프리셋 & 워터마크 -->
      <div class="sec">
        <div class="sec-title">🏷️ 채널 워터마크 & 프리셋 관리</div>
        <div class="row-flex" style="margin-bottom:8px;">
          <button type="button" class="ghost" id="addPresetBtn" style="flex:1;">+ 새 채널로 추가 저장</button>
          <button type="button" class="ghost" id="delPresetBtn">현재 채널 삭제</button>
        </div>

        <div class="grid2">
          <div>
            <label class="lbl">워터마크 표시</label>
            <select id="wmType">
              <option value="both">로고 + 채널명</option>
              <option value="text" selected>채널명만</option>
              <option value="logo">로고만</option>
              <option value="none">숨김</option>
            </select>
          </div>
          <div>
            <label class="lbl">워터마크 기준 위치</label>
            <select id="wmPos">
              <option value="br" selected>오른쪽 아래</option>
              <option value="bl">왼쪽 아래</option>
              <option value="tc">위쪽 가운데</option>
              <option value="tr">오른쪽 위</option>
            </select>
          </div>
        </div>

        <label class="lbl">채널명 텍스트 (파일명 겸용)</label>
        <input type="text" id="wmText" value="사랑추구권">

        <div class="logo-box">
          <img id="logoPreview" class="logo-preview" alt="로고">
          <div style="flex:1;">
            <div style="font-size:12.5px; font-weight:600; margin-bottom:4px;">채널 로고 이미지</div>
            <input type="file" id="logoFile" accept="image/*" style="font-size:12px; width:100%;">
          </div>
          <button type="button" class="ghost" id="clearLogoBtn" style="padding:6px 10px; font-size:12px;">제거</button>
        </div>

        <div class="grid4" style="margin-top:6px;">
          <div>
            <label class="lbl">로고 모양</label>
            <select id="logoShape">
              <option value="circle" selected>원형</option>
              <option value="round">둥근사각</option>
              <option value="orig">원본</option>
            </select>
          </div>
          <div>
            <label class="lbl">크기(px)</label>
            <input type="number" id="wmSize" value="30" min="12" max="100">
          </div>
          <div>
            <label class="lbl">투명도(%)</label>
            <input type="number" id="wmAlpha" value="45" min="5" max="100">
          </div>
          <div>
            <label class="lbl">모서리여백(px)</label>
            <input type="number" id="wmMargin" value="44" min="10" max="200">
          </div>
        </div>
      </div>

      <!-- 2. 색상 테마 템플릿 (12종) & 디자인 효과 -->
      <div class="sec">
        <div class="sec-title">🎨 색상 테마 템플릿 (12종) & 디자인 효과</div>
        <div class="themes" id="themeList">
          <button type="button" class="theme-btn active" data-theme="white" style="background:#ffffff;color:#111111;">클린화이트</button>
          <button type="button" class="theme-btn" data-theme="dark" style="background:#161618;color:#f4f4f6;">딥다크</button>
          <button type="button" class="theme-btn" data-theme="warm" style="background:#f7f3e8;color:#2b2118;">웜페이퍼</button>
          <button type="button" class="theme-btn" data-theme="navy" style="background:#14213d;color:#ffffff;">딥네이비</button>
          <button type="button" class="theme-btn" data-theme="charcoal" style="background:#2b2d42;color:#edf2f4;">모던차콜</button>
          <button type="button" class="theme-btn" data-theme="cream" style="background:#fffdf2;color:#332e2a;">크림에세이</button>
          <button type="button" class="theme-btn" data-theme="forest" style="background:#1b3b2b;color:#f1faee;">포레스트</button>
          <button type="button" class="theme-btn" data-theme="pink" style="background:#fff0f3;color:#4a1525;">소프트핑크</button>
          <button type="button" class="theme-btn" data-theme="purple" style="background:#231942;color:#f7ede2;">미드나잇퍼플</button>
          <button type="button" class="theme-btn" data-theme="latte" style="background:#efe6dd;color:#3d2c2e;">라떼브라운</button>
          <button type="button" class="theme-btn" data-theme="sky" style="background:#edf6f9;color:#0f2942;">스카이블루</button>
          <button type="button" class="theme-btn" data-theme="contrast" style="background:#000000;color:#ffe600;">고대비블랙</button>
        </div>

        <div class="row-flex" style="margin-top:10px; justify-content:space-between;">
          <div class="row-flex">
            <span style="font-size:12.5px;font-weight:600;">배경</span>
            <input type="color" id="bgColor" value="#ffffff">
            <span style="font-size:12.5px;font-weight:600;">글자</span>
            <input type="color" id="inkColor" value="#111111">
            <span style="font-size:12.5px;font-weight:600;">**강조**</span>
            <input type="color" id="hlColor" value="#ffe066">
          </div>
          <select id="hlStyle" style="width:auto; padding:8px 10px; font-size:13px;">
            <option value="marker" selected>**형광펜 밑줄**</option>
            <option value="color">**글자색 변경**</option>
            <option value="box">**배경 박스**</option>
          </select>
        </div>

        <div class="grid2" style="margin-top:8px;">
          <div>
            <label class="lbl">배경·테두리 디자인 효과</label>
            <select id="frameStyle">
              <option value="none" selected>효과 없음 (깔끔)</option>
              <option value="thin">안쪽 얇은 실선 프레임</option>
              <option value="double">클래식 이중선 프레임</option>

      const maxD = 240;
      let w = tempImg.width, h = tempImg.height;
      if(w > maxD || h > maxD){
        if(w > h){ h = Math.round(h * maxD / w); w = maxD; }
        else { w = Math.round(w * maxD / h); h = maxD; }

/* ---------- 숫자 선택지(1. 2. 3.) 파싱 헬퍼 ---------- */
const CHOICE_LINE_RE = /^(?:(\d{1,2})[.)]|(\d{1,2})번\s*[:.-]?|([①②③④⑤⑥⑦⑧⑨⑩]))\s*(.+)$/;
const CIRCLE_MAP = {"①":"1","②":"2","③":"3","④":"4","⑤":"5","⑥":"6","⑦":"7","⑧":"8","⑨":"9","⑩":"10"};

function extractChoices(rawSlideText, forceChoice = false){
  const normalized = rawSlideText.trim().replace(/([ \t]+)(?=(?:\d{1,2}[.)]|\d{1,2}번|[①②③④⑤⑥⑦⑧⑨⑩])\s)/g, "\n");
  const lines = normalized.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  const items = [];
  const titleLines = [];
  let started = false;

  for(const line of lines){
    const m = CHOICE_LINE_RE.exec(line);
    if(m){
      started = true;
      const num = m[1] || m[2] || CIRCLE_MAP[m[3]] || String(items.length + 1);
      items.push({num, text: m[4].trim()});
    }else if(!started){
      titleLines.push(line);
    }else if(items.length){
      items[items.length - 1].text += "\n" + line;
    }
  }

  if(items.length >= 2){
    return {title: titleLines.join("\n").trim(), items};
  }

  if(forceChoice){
    let fallbackLines = lines;
    if(fallbackLines.length < 2){
      fallbackLines = (rawSlideText.trim().match(/[^.!?]+[.!?]*/g) || [rawSlideText.trim()]).map(s=>s.trim()).filter(Boolean);
    }
    if(fallbackLines.length >= 2){
      return {
        title: "",
        items: fallbackLines.map((t, idx) => ({num: String(idx + 1), text: t}))
      };
    }
  }
  return null;
}

/* ---------- 원고 나누기 ---------- */
function mergeTrailingChoiceBlocks(blocks){
  if(blocks.length < 2) return blocks;
  const firstStartsWith1 = /^\s*(?:1[.)]|1번|①)/.test(blocks[0]);
  if(firstStartsWith1) return blocks;

  let startIdx = -1;
  for(let i = 1; i < blocks.length; i++){
    if(/(?:^|\n)\s*(?:1[.)]|1번|①)\s*\S/.test(blocks[i])){
      let expected = 2;
      let ok = true;
      for(let j = i + 1; j < blocks.length; j++){
        const re = new RegExp(`^\\s*(?:${expected}[.)]|${expected}번)\\s*\\S`);
        if(re.test(blocks[j])) expected++;
        else { ok = false; break; }
      }
      if(ok && expected >= 3){
        startIdx = i;
        break;
      }
    }
  }
  if(startIdx !== -1){
    if(startIdx >= 2 && /^\s*(?:1[.)]|1번|①)/.test(blocks[startIdx])){
      const prevBlock = blocks[startIdx - 1].trim();
      if(prevBlock.length <= 45 && (prevBlock.endsWith("?") || prevBlock.includes("생각") || prevBlock.includes("선택"))){
        startIdx = startIdx - 1;
      }
    }
    const mergedTail = blocks.slice(startIdx).join("\n");
    return [...blocks.slice(0, startIdx), mergedTail];
  }
  return blocks;
}

function splitByBlank(text){
  const rawBlocks = text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  return mergeTrailingChoiceBlocks(rawBlocks);
}

function findNumberMarks(text){
  const re = /^[ \t]*(\d{1,3})[.)](?!\d)[ \t]*/gm;
  const marks = [];
  let m, expect = 1;
  while((m = re.exec(text))){
    if(Number(m[1]) === expect){
      marks.push({start:m.index, end:m.index + m[0].length});
      expect++;
    }
  }
  return marks;
}

function splitByNumber(text){
  const marks = findNumberMarks(text);
  if(!marks.length) return [text.trim()];
  const parts = [];
  const pre = text.slice(0, marks[0].start).trim();
  if(pre) parts.push(pre);
  marks.forEach((mk, i)=>{
    const e = i+1 < marks.length ? marks[i+1].start : text.length;
    const body = text.slice(mk.end, e).trim();
    if(body) parts.push(body);
  });
  return parts;
}

function splitByDelim(text){
  const d = $("splitDelim").value;
  if(!d.trim()) return splitByBlank(text);
  return text.split(d).map(x=>x.trim()).filter(Boolean);
}

function splitPages(text){
  const mode = $("splitMode").value;
  if(mode === "number") return splitByNumber(text);
  if(mode === "delim") return splitByDelim(text);
  return splitByBlank(text);
}

function updateSplitUI(){
  const mode = $("splitMode").value;
  const lastType = $("lastPageType").value;
  const dBox = $("splitDelim");
  dBox.style.display = mode === "delim" ? "" : "none";

  let lastEx = "여러분의 생각은 어떠신가요?\n1. 첫 번째 선택지\n2. 두 번째 선택지\n3. 세 번째 선택지";
  if(lastType === "vs") lastEx = "마지막 장 위쪽 내용\nvs\n아래쪽 내용";
  else if(lastType === "plain") lastEx = "마지막 장 마무리 내용";

  if(mode === "number"){
    $("src").placeholder = `1. 첫 번째 장 내용 (표지)\n2. 두 번째 장 내용 (**강조할 말**)\n3. 세 번째 장 내용`;
  }else if(mode === "delim"){
    const d = dBox.value.trim() || "---";
    $("src").placeholder = `첫 번째 장 내용 (표지)\n${d}\n두 번째 장 내용 (**강조할 말**)\n${d}\n${lastEx}`;
  }else{
    $("src").placeholder = `첫 번째 장 내용 (표지)\n\n두 번째 장 내용 (**강조할 말**)\n\n${lastEx}`;
  }
  updateNumHint();
}

function updateNumHint(){
  const mode = $("splitMode").value;
  const raw = $("src").value.replace(/\r/g,"").trim();
  const marks = findNumberMarks(raw);
  const startsNearTop = marks.length >= 3 && marks[0].start < 10;
  const show = mode === "blank" && startsNearTop;
  $("numHintText").textContent = `원고 맨 앞부터 번호(1.~${marks.length}.)가 보입니다. 전체 원고를 번호마다 한 장씩 나눌까요?`;
  $("numHint").hidden = !show;
}

function splitVS(p){
  const t = p.trim();
  const m = /(^|\s)vs(\s|$)/i.exec(t);
  if(m) return {top:t.slice(0,m.index).trim(), bottom:t.slice(m.index+m[0].length).trim()};
  const lines = t.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  if(lines.length >= 2){
    const half = Math.ceil(lines.length / 2);
    return {top:lines.slice(0, half).join("\n"), bottom:lines.slice(half).join("\n")};
  }
  const sents = t.match(/[^.!?]+[.!?]*\s*/g) || [t];
  if(sents.length < 2) return {top:t, bottom:""};
  const half = Math.ceil(sents.length/2);
  return {top:sents.slice(0,half).join("").trim(), bottom:sents.slice(half).join("").trim()};
}

function formatBodyText(str){
  return wrapMode === "merge" ? str.replace(/\s*\n\s*/g, " ") : str;
}

function parse(raw){
  const text = raw.replace(/\r/g,"").trim();
  if(!text) return [];
  const parts = splitPages(text).filter(Boolean);
  const lastType = $("lastPageType").value;

  return parts.map((p,i)=>{
    const isLast = i === parts.length - 1;
    const hasVsWord = /(^|\s)vs(\s|$)/i.test(p);
    const forceChoice = isLast && (lastType === "choice_box" || lastType === "choice_clean");
    const detectedChoice = extractChoices(p, forceChoice);

    if(isLast && (forceChoice || (lastType === "auto" && detectedChoice !== null && !hasVsWord))){
      if(detectedChoice){
        return {
          type: "choice",
          choiceStyle: lastType === "choice_clean" ? "clean" : "box",
          title: detectedChoice.title,
          items: detectedChoice.items
        };
      }
    }

    const useVs = isLast && (lastType === "vs" || (lastType === "auto" && hasVsWord));
    if(useVs){
      const v = splitVS(p);
      if(v.bottom){
        return {
          type:"vs",
          top: formatBodyText(v.top),
          bottom: formatBodyText(v.bottom)
        };
      }
    }

    return {
      type:"plain",
      text: formatBodyText(p)
    };
  });
}

function pageToRawString(it){
  if(it.type === "plain") return it.text;
  if(it.type === "vs") return it.top + " vs " + it.bottom;
  if(it.type === "choice"){
    const body = it.items.map(x=>`${x.num}. ${x.text}`).join("\n");
    return it.title ? `${it.title}\n${body}` : body;
  }
  return "";
}

function limitPages(list){
  const maxP = Math.max(1, Number($("maxPages").value) || 10);
  if(list.length <= maxP) return list;
  if(maxP === 1){
    return [{type:"plain", text:list.map(pageToRawString).join("\n\n")}];
  }
  const last = list[list.length-1];
  const items = list.slice(0, -1);
  const k = maxP - 1;
  const len = items.map(it=>pageToRawString(it).length);
  const n = items.length;
  const pre = [0]; len.forEach(x=>pre.push(pre[pre.length-1]+x));
  const INF = 1e18;
  const dp = Array.from({length:k+1}, ()=>Array(n+1).fill(INF));
  const cut = Array.from({length:k+1}, ()=>Array(n+1).fill(0));
  dp[0][0] = 0;
  for(let g=1; g<=k; g++){
    for(let i=g; i<=n; i++){
      for(let j=g-1; j<i; j++){
        if(dp[g-1][j] >= INF) continue;
        const w = pre[i]-pre[j];
        const v = dp[g-1][j] + w*w;
        if(v < dp[g][i]){ dp[g][i] = v; cut[g][i] = j; }
      }
    }
  }
  const groups = [];
  let i = n;
  for(let g=k; g>=1; g--){ const j = cut[g][i]; groups.unshift(items.slice(j,i)); i = j; }
  const merged = groups.map(gr=>({type:"plain", text:gr.map(pageToRawString).join("\n\n")}));
  merged.push(last);
  return merged;
}

/* ---------- 줄바꿈 & **강조** 처리 ---------- */
const stripMd = s => s.replace(/\*\*/g, "");

function wrap(ctx, text, maxW){
  const lines = [], words = text.split(/[ \t]+/);
  let cur = "";
  for(const w of words){
    if(!w) continue;
    const test = cur ? cur+" "+w : w;
    if(ctx.measureText(stripMd(test)).width <= maxW){ cur = test; continue; }
    if(cur) lines.push(cur);
    if(ctx.measureText(stripMd(w)).width > maxW){
      let piece = "";
      for(const ch of w){
        if(ctx.measureText(stripMd(piece+ch)).width > maxW){ lines.push(piece); piece = ch; }
        else piece += ch;
      }
      cur = piece;
    }else cur = w;
  }
  if(cur) lines.push(cur);
  return lines.length ? lines : [""];
}

function wrapBalanced(ctx, text, maxW){
  if(text.indexOf("\n") >= 0){
    const out = [];
    text.split("\n").forEach(par=>{
      if(!par.trim()){ out.push(""); return; }
      (wrapMode === "keep" ? wrap(ctx, par, maxW) : wrapBalanced(ctx, par, maxW)).forEach(l=>out.push(l));
    });
    return out;
  }
  if(wrapMode === "keep") return wrap(ctx, text, maxW);
  const base = wrap(ctx, text, maxW);
  const n = base.length;
  if(n <= 1) return base;
  let lo = maxW*0.55, hi = maxW;
  for(let i=0;i<14;i++){
    const mid = (lo+hi)/2;
    if(wrap(ctx, text, mid).length === n) hi = mid; else lo = mid;
  }
  return wrap(ctx, text, hi);
}

function fit(ctx, fontCss, texts, maxW, maxH, maxSize, minSize, lhRatio){
  for(let s=maxSize; s>=minSize; s-=2){
    ctx.font = fontCss(s);
    const lh = s * lhRatio;
    const all = texts.map(t=>wrapBalanced(ctx,t,maxW));
    if(all.every(l=>l.length*lh <= maxH)) return {size:s, lh, all};
  }
  ctx.font = fontCss(minSize);
  return {size:minSize, lh:minSize*lhRatio, all:texts.map(t=>wrapBalanced(ctx,t,maxW))};
}

function drawFormattedLines(ctx, lines, startY, lh, fontSize, align, padX, inkCol, hlCol, hlStyle, f, isCover = false, customLeftX = null, customMaxW = null){
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  let hlState = false;
  let y = startY;
  const baseX = customLeftX !== null ? customLeftX : padX;
  const boxW = customMaxW !== null ? customMaxW : (WIDTH - padX * 2);

  const setFontWeight = bold => {
    const wt = (bold || isCover) ? f.cover : f.weight;
    ctx.font = `${wt} ${fontSize}px "${f.family}", "Pretendard", "Noto Sans KR", sans-serif`;
  };

  lines.forEach(line => {
    if(!line){ y += lh; return; }
    const parts = line.split("**");
    const segs = [];
    let totalW = 0;
    for(let i=0; i<parts.length; i++){
      if(parts[i]){
        setFontWeight(hlState);
        const w = ctx.measureText(parts[i]).width;
        segs.push({text:parts[i], hl:hlState, w});
        totalW += w;
      }
      if(i < parts.length - 1) hlState = !hlState;
    }
    let x = baseX;
    if(align === "center") x = baseX + (boxW - totalW) / 2;
    else if(align === "right") x = baseX + boxW - totalW;

    segs.forEach(seg => {
      setFontWeight(seg.hl);
      if(seg.hl && hlStyle === "marker"){
        ctx.save();
        ctx.fillStyle = hlCol;
        ctx.globalAlpha = 0.55;
        ctx.fillRect(x - 2, y + fontSize*0.08, seg.w + 4, fontSize*0.42);
        ctx.restore();
        ctx.fillStyle = inkCol;
      } else if(seg.hl && hlStyle === "box"){
        ctx.save();
        ctx.fillStyle = hlCol;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(x - 4, y - fontSize*0.52, seg.w + 8, fontSize*1.04);
        ctx.restore();
        ctx.fillStyle = inkCol;
      } else if(seg.hl && hlStyle === "color"){
        ctx.fillStyle = hlCol;
      } else {
        ctx.fillStyle = inkCol;
      }
      ctx.fillText(seg.text, x, y);
      x += seg.w;
    });
    y += lh;
  });
}

function hexToRgb(hex){
  const clean = hex.replace("#","");
  const num = parseInt(clean.length===3 ? clean.split("").map(c=>c+c).join("") : clean, 16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function isDarkColor(hex){
  const {r,g,b} = hexToRgb(hex);
  return (r*0.299 + g*0.587 + b*0.114) < 128;
}

function drawChoiceLayout(ctx, page, f, padX, padY, areaH, maxFont, lhRatio, bgCol, inkCol, hlCol, hlStyle){
  const style = page.choiceStyle || "box";
  const maxW = WIDTH - padX * 2;
  const startMax = Math.min(maxFont, 54);
  const minSize = 22;

  if(style === "box"){
    let best = null;
    for(let s = startMax; s >= minSize; s -= 2){
      const lh = s * Math.min(lhRatio, 1.48);
      const titleSize = Math.round(s * 1.08);
      const titleLh = titleSize * 1.4;
      ctx.font = `${f.cover} ${titleSize}px "${f.family}", "Pretendard", sans-serif`;
      const titleLines = page.title ? wrapBalanced(ctx, page.title, maxW) : [];
      const titleBlockH = titleLines.length ? (titleLines.length * titleLh + s * 0.75) : 0;

      const badgeSize = Math.round(s * 1.42);
      const boxPadX = Math.round(s * 0.65);
      const boxPadY = Math.round(s * 0.55);
      const badgeGap = Math.round(s * 0.55);
      const textMaxW = maxW - boxPadX * 2 - badgeSize - badgeGap;

      ctx.font = `${f.weight} ${s}px "${f.family}", "Pretendard", sans-serif`;
      const itemWrapped = page.items.map(it => wrap(ctx, it.text, textMaxW));
      const boxHeights = itemWrapped.map(lines => Math.max(badgeSize, lines.length * lh) + boxPadY * 2);
      const boxGap = Math.round(s * 0.45);
      const totalBoxesH = boxHeights.reduce((a,b)=>a+b, 0) + boxGap * Math.max(0, page.items.length - 1);
      const totalH = titleBlockH + totalBoxesH;

      best = {s, lh, titleSize, titleLh, titleLines, titleBlockH, badgeSize, boxPadX, boxPadY, badgeGap, textMaxW, itemWrapped, boxHeights, boxGap, totalH};
      if(totalH <= areaH) break;
    }

    let curY = padY + (areaH - best.totalH) / 2;

    if(best.titleLines.length){
      drawFormattedLines(
        ctx, best.titleLines, curY + best.titleLh / 2, best.titleLh,
        best.titleSize, "center", padX, inkCol, hlCol, hlStyle, f, true
      );
      curY += best.titleBlockH;
    }

    const darkBg = isDarkColor(bgCol);
    const badgeFill = hlCol;
    const badgeTextCol = isDarkColor(badgeFill) ? "#ffffff" : "#111111";

    page.items.forEach((it, idx) => {
      const bh = best.boxHeights[idx];
      const lines = best.itemWrapped[idx];

      ctx.save();
      ctx.fillStyle = inkCol;
      ctx.globalAlpha = darkBg ? 0.09 : 0.045;
      ctx.beginPath();
      ctx.roundRect(padX, curY, maxW, bh, 22);
      ctx.fill();

      ctx.strokeStyle = inkCol;
      ctx.globalAlpha = darkBg ? 0.25 : 0.16;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(padX, curY, maxW, bh, 22);
      ctx.stroke();
      ctx.restore();

      const bx = padX + best.boxPadX;
      const by = curY + (bh - best.badgeSize) / 2;
      ctx.save();
      ctx.fillStyle = badgeFill;
      ctx.beginPath();
      ctx.roundRect(bx, by, best.badgeSize, best.badgeSize, best.badgeSize * 0.32);
      ctx.fill();

      ctx.fillStyle = badgeTextCol;
      ctx.font = `${f.cover} ${Math.round(best.s * 0.88)}px "${f.family}", "Pretendard", sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(it.num, bx + best.badgeSize / 2, by + best.badgeSize / 2 + 1);
      ctx.restore();

      const tx = bx + best.badgeSize + best.badgeGap;
      const textStartY = curY + (bh - lines.length * best.lh) / 2 + best.lh / 2;
      drawFormattedLines(
        ctx, lines, textStartY, best.lh, best.s, "left", padX,
        inkCol, hlCol, hlStyle, f, false, tx, best.textMaxW
      );

      curY += bh + best.boxGap;
    });
  } else {
    let best = null;
    for(let s = startMax; s >= minSize; s -= 2){
      const lh = s * lhRatio;
      const titleSize = Math.round(s * 1.08);
      const titleLh = titleSize * 1.45;
      ctx.font = `${f.cover} ${titleSize}px "${f.family}", "Pretendard", sans-serif`;
      const titleLines = page.title ? wrapBalanced(ctx, page.title, maxW) : [];
      const titleBlockH = titleLines.length ? (titleLines.length * titleLh + s * 0.85) : 0;

      ctx.font = `${f.cover} ${s}px "${f.family}", "Pretendard", sans-serif`;
      const numW = ctx.measureText("88. ").width;
      const textMaxW = maxW - numW;

      ctx.font = `${f.weight} ${s}px "${f.family}", "Pretendard", sans-serif`;
      const itemWrapped = page.items.map(it => wrap(ctx, it.text, textMaxW));
      const itemGap = Math.round(s * 0.55);
      const itemsH = itemWrapped.reduce((sum, lines) => sum + lines.length * lh, 0) + itemGap * Math.max(0, page.items.length - 1);
      const totalH = titleBlockH + itemsH;

      best = {s, lh, titleSize, titleLh, titleLines, titleBlockH, numW, textMaxW, itemWrapped, itemGap, totalH};
      if(totalH <= areaH) break;
    }

    let curY = padY + (areaH - best.totalH) / 2;

    if(best.titleLines.length){
      drawFormattedLines(
        ctx, best.titleLines, curY + best.titleLh / 2, best.titleLh,
        best.titleSize, textAlign, padX, inkCol, hlCol, hlStyle, f, true
      );
      curY += best.titleBlockH;
    }

    page.items.forEach((it, idx) => {
      const lines = best.itemWrapped[idx];
      const firstLineY = curY + best.lh / 2;

      ctx.save();
      ctx.font = `${f.cover} ${best.s}px "${f.family}", "Pretendard", sans-serif`;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      const labelStr = `${it.num}.`;
      const lw = ctx.measureText(labelStr).width;
      if(hlStyle === "marker"){
        ctx.fillStyle = hlCol;
        ctx.globalAlpha = 0.6;
        ctx.fillRect(padX - 2, firstLineY + best.s * 0.08, lw + 4, best.s * 0.42);
        ctx.globalAlpha = 1;
        ctx.fillStyle = inkCol;
      }else if(hlStyle === "color"){
        ctx.fillStyle = hlCol;
      }else{
        ctx.fillStyle = inkCol;
      }
      ctx.fillText(labelStr, padX, firstLineY);
      ctx.restore();

      drawFormattedLines(
        ctx, lines, firstLineY, best.lh, best.s, "left", padX,
        inkCol, hlCol, hlStyle, f, false, padX + best.numW, best.textMaxW
      );

      curY += lines.length * best.lh + best.itemGap;
    });
  }
}

function drawFrameAndDeco(ctx, H, bgCol, inkCol, hlCol, padX, padY){
  const frame = $("frameStyle").value;
  const deco = $("topDeco").value;

  ctx.save();
  ctx.strokeStyle = inkCol;
  ctx.fillStyle = inkCol;

  if(frame === "thin"){
    ctx.globalAlpha = 0.2;
    ctx.lineWidth = 3;
    ctx.strokeRect(36, 36, WIDTH - 72, H - 72);
  }else if(frame === "double"){
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 4;
    ctx.strokeRect(32, 32, WIDTH - 64, H - 64);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(44, 44, WIDTH - 88, H - 88);
  }else if(frame === "corner"){
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 5;
    const m = 42, len = 48;
    ctx.beginPath();
    ctx.moveTo(m, m+len); ctx.lineTo(m, m); ctx.lineTo(m+len, m);
    ctx.moveTo(WIDTH-m-len, m); ctx.lineTo(WIDTH-m, m); ctx.lineTo(WIDTH-m, m+len);
    ctx.moveTo(m, H-m-len); ctx.lineTo(m, H-m); ctx.lineTo(m+len, H-m);
    ctx.moveTo(WIDTH-m-len, H-m); ctx.lineTo(WIDTH-m, H-m); ctx.lineTo(WIDTH-m, H-m-len);
    ctx.stroke();
  }else if(frame === "topbot"){
    ctx.fillStyle = hlCol;
    ctx.globalAlpha = 0.85;
    ctx.fillRect(0, 0, WIDTH, 18);
    ctx.fillRect(0, H - 18, WIDTH, 18);
  }else if(frame === "card"){
    ctx.globalAlpha = 0.08;
    ctx.fillRect(48, 48, WIDTH - 84, H - 84);
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgCol;
    ctx.fillRect(38, 38, WIDTH - 84, H - 84);
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(38, 38, WIDTH - 84, H - 84);
  }else if(frame === "note"){
    ctx.globalAlpha = 0.07;
    ctx.lineWidth = 2;
    for(let y = padY; y < H - padY; y += 64){
      ctx.beginPath();
      ctx.moveTo(padX * 0.6, y);
      ctx.lineTo(WIDTH - padX * 0.6, y);
      ctx.stroke();
    }
  }
  ctx.restore();

  if(deco !== "none"){
    ctx.save();
    ctx.fillStyle = inkCol;
    ctx.strokeStyle = inkCol;
    ctx.textAlign = "center";
    if(deco === "quote"){
      ctx.globalAlpha = 0.16;
      ctx.font = `700 90px "Georgia", serif`;
      ctx.textBaseline = "top";
      ctx.fillText("“", WIDTH/2, Math.max(24, padY - 52));
    }else if(deco === "bar"){
      ctx.fillStyle = hlCol;
      ctx.globalAlpha = 0.9;
      ctx.fillRect(WIDTH/2 - 36, Math.max(36, padY - 30), 72, 7);
    }else if(deco === "dot"){
      ctx.globalAlpha = 0.3;
      ctx.font = `400 26px sans-serif`;
      ctx.textBaseline = "middle";
      ctx.fillText("◆", WIDTH/2, Math.max(44, padY - 24));
    }
    ctx.restore();
  }
}

function draw(page, idx, total, f){
  const H = getHeight();
  const c = document.createElement("canvas");
  c.width = WIDTH;
  c.height = H;
  const ctx = c.getContext("2d");

  const bgCol = $("bgColor").value;
  const inkCol = $("inkColor").value;
  const hlCol = $("hlColor").value;
  const hlStyle = $("hlStyle").value;
  const padX = Number($("padX").value) || 110;
  const padY = Number($("padY").value) || 110;
  const maxFont = Number($("maxFont").value) || 66;
  const lhRatio = Number($("lineHeight").value) || 1.6;
  const footH = 70;

  ctx.fillStyle = bgCol;
  ctx.fillRect(0, 0, WIDTH, H);

  drawFrameAndDeco(ctx, H, bgCol, inkCol, hlCol, padX, padY);

  const isCover = idx === 0 && $("coverCenter").checked && page.type === "plain";
  const wt = isCover ? f.cover : f.weight;
  const curAlign = isCover ? "center" : textAlign;
  const css = s => `${wt} ${s}px "${f.family}", "Pretendard", "Noto Sans KR", sans-serif`;
  const maxW = WIDTH - padX*2;
  const areaH = H - padY*2 - footH/2;

  if(page.type === "plain"){
    const r = fit(ctx, css, [page.text], maxW, areaH, maxFont, 20, lhRatio);
    const lines = r.all[0];
    const startY = padY + (areaH - lines.length*r.lh)/2 + r.lh/2;
    drawFormattedLines(ctx, lines, startY, r.lh, r.size, curAlign, padX, inkCol, hlCol, hlStyle, f, isCover);
  }else if(page.type === "choice"){
    drawChoiceLayout(ctx, page, f, padX, padY, areaH, maxFont, lhRatio, bgCol, inkCol, hlCol, hlStyle);
  }else{
    const vsH = 110;
    const halfH = (areaH - vsH)/2;
    const r = fit(ctx, css, [page.top, page.bottom], maxW, halfH, Math.min(maxFont, 58), 20, lhRatio);
    const tl = r.all[0], bl = r.all[1];

    const topY = padY + (halfH - tl.length*r.lh)/2 + r.lh/2;
    drawFormattedLines(ctx, tl, topY, r.lh, r.size, curAlign, padX, inkCol, hlCol, hlStyle, f, false);

    const botY = padY + halfH + vsH + (halfH - bl.length*r.lh)/2 + r.lh/2;
    drawFormattedLines(ctx, bl, botY, r.lh, r.size, curAlign, padX, inkCol, hlCol, hlStyle, f, false);

    const cy = padY + halfH + vsH/2;
    ctx.save();
    ctx.strokeStyle = inkCol;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(padX, cy); ctx.lineTo(WIDTH/2 - 75, cy);
    ctx.moveTo(WIDTH/2 + 75, cy); ctx.lineTo(WIDTH - padX, cy);
    ctx.stroke();
    ctx.restore();

    ctx.fillStyle = hlStyle === "color" ? hlCol : inkCol;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `700 52px "Pretendard","Noto Sans KR",sans-serif`;
    ctx.fillText("VS", WIDTH/2, cy + 2);
  }

  const pStyle = $("pageNumStyle").value;
  if(pStyle !== "none"){
    const px = Number($("pageNumX").value) || 540;
    const pyBottom = Number($("pageNumY").value) || 58;
    const py = H - pyBottom;
    const pSize = Number($("pageNumSize").value) || 32;

    ctx.save();
    ctx.fillStyle = inkCol;
    ctx.globalAlpha = 0.45;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `600 ${pSize}px "${f.family}", "Pretendard", sans-serif`;

    if(pStyle === "slash"){
      ctx.fillText(`${idx+1} / ${total}`, px, py);
    }else if(pStyle === "num"){
      ctx.fillText(String(idx+1).padStart(2,"0"), px, py);
    }else if(pStyle === "plain"){
      ctx.fillText(String(idx+1), px, py);
    }else if(pStyle === "dots"){
      const dotGap = Math.max(16, Math.round(pSize * 0.7));
      const startX = px - ((total-1)*dotGap)/2;
      for(let d=0; d<total; d++){
        ctx.globalAlpha = d === idx ? 0.85 : 0.22;
        ctx.beginPath();
        ctx.arc(startX + d*dotGap, py, d === idx ? pSize*0.2 : pSize*0.14, 0, Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  const wmType = $("wmType").value;
  if(wmType !== "none"){
    const wmText = $("wmText").value.trim();
    const wmPos = $("wmPos").value;
    const wmSize = Number($("wmSize").value) || 30;
    const wmAlpha = (Number($("wmAlpha").value) || 45) / 100;
    const margin = Number($("wmMargin").value) || 44;
    const shape = $("logoShape").value;

    const showLogo = (wmType === "both" || wmType === "logo") && logoImg;
    const showText = (wmType === "both" || wmType === "text") && wmText;

    if(showLogo || showText){
      ctx.save();
      ctx.globalAlpha = wmAlpha;
      ctx.fillStyle = inkCol;
      ctx.font = `${f.weight} ${wmSize}px "${f.family}", "Pretendard", sans-serif`;
      ctx.textBaseline = "middle";

      const textW = showText ? ctx.measureText(wmText).width : 0;
      const iconS = showLogo ? Math.round(wmSize * 1.45) : 0;
      const gap = (showLogo && showText) ? 10 : 0;
      const groupW = iconS + gap + textW;

      let gx = WIDTH - margin - groupW;
      let gy = H - margin - wmSize/2;

      if(wmPos === "bl"){ gx = margin; gy = H - margin - wmSize/2; }
      else if(wmPos === "tc"){ gx = (WIDTH - groupW)/2; gy = margin + wmSize/2; }
      else if(wmPos === "tr"){ gx = WIDTH - margin - groupW; gy = margin + wmSize/2; }

      if(showLogo){
        const ix = gx, iy = gy - iconS/2;
        ctx.save();
        if(shape === "circle"){
          ctx.beginPath();
          ctx.arc(ix + iconS/2, gy, iconS/2, 0, Math.PI*2);
          ctx.closePath();
          ctx.clip();
        }else if(shape === "round"){
          ctx.beginPath();
          ctx.roundRect(ix, iy, iconS, iconS, iconS * 0.22);
          ctx.closePath();
          ctx.clip();
        }
        ctx.drawImage(logoImg, ix, iy, iconS, iconS);
        ctx.restore();
      }

      if(showText){
        ctx.textAlign = "left";
        ctx.fillText(wmText, gx + iconS + gap, gy + 1);
      }
      ctx.restore();
    }
  }

  return c;
}

const toBlob = c => new Promise(res=>c.toBlob(res, "image/png"));

async function render(){
  const myJob = ++renderJobId;
  const snapPages = [...pages];
  if(!snapPages.length){
    canvases = [];
    blobs = [];
    $("list").innerHTML = "";
    $("bottomActions").hidden = true;
    $("msg").textContent = "";
    return;
  }

  const f = FONTS[fontSel.value] || FONTS[0];
  $("msg").textContent = `총 ${snapPages.length}장 이미지 생성 중…`;

  const wmSample = $("wmText").value || "사랑추구권";
  const sample = snapPages.map(pageToRawString).join("") + wmSample + "VS0123456789/.";
  try{
    await Promise.all([
      document.fonts.load(`${f.weight} 40px "${f.family}"`, sample),
      document.fonts.load(`${f.cover} 40px "${f.family}"`, sample),
    ]);
  }catch(e){}

  if(myJob !== renderJobId) return;

  const localCanvases = snapPages.map((p,i)=>draw(p, i, snapPages.length, f));
  const localBlobs = await Promise.all(localCanvases.map(c => toBlob(c)));

  if(myJob !== renderJobId) return;

  canvases = localCanvases;
  blobs = localBlobs;

  const list = $("list");
  list.innerHTML = "";
  const n = localCanvases.length;

  localCanvases.forEach((c,i)=>{
    const card = document.createElement("div");
    card.className = "card";

    const head = document.createElement("div");
    head.className = "card-head";

    const leftBox = document.createElement("div");
    const numBadge = document.createElement("span");
    numBadge.className = "badge-num";
    numBadge.textContent = `${String(i+1).padStart(2,"0")} / ${String(n).padStart(2,"0")}`;

    const typeLabel = document.createElement("span");
    typeLabel.textContent = snapPages[i].type === "choice"
      ? (snapPages[i].choiceStyle === "clean" ? "1.2.3. 선택지 (텍스트형)" : "1.2.3. 선택지 (박스형)")
      : (snapPages[i].type === "vs" ? "VS 2분할 레이아웃" : (i === 0 ? "표지 (첫 장)" : "본문"));

    leftBox.appendChild(numBadge);
    leftBox.appendChild(typeLabel);

    const dlBtn = document.createElement("button");
    dlBtn.type = "button";
    dlBtn.className = "ghost";
    dlBtn.textContent = `${i+1}번만 저장`;
    dlBtn.onclick = () => download(localBlobs[i], fname(i, n));

    head.appendChild(leftBox);
    head.appendChild(dlBtn);

    const img = document.createElement("img");
    img.src = c.toDataURL("image/png");
    img.alt = `${i+1}번 이미지`;

    card.appendChild(head);
    card.appendChild(img);
    list.appendChild(card);
  });

  $("saveAll").textContent = `모두 저장 (${n}장)`;
  $("shareAll").textContent = `한 번에 공유 (${n}장 · 인스타/유튜브)`;
  $("bottomActions").hidden = (n === 0);
  $("msg").textContent = `총 ${n}장 제작 완료!`;
}

function download(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}

let saving = false;
$("saveAll").onclick = async ()=>{
  if(saving || !blobs.length) return;
  saving = true;

  const snapBlobs = [...blobs];
  const n = snapBlobs.length;
  const delayMs = Math.max(500, Math.round((Number($("saveDelay").value) || 1.4) * 1000));
  const btn = $("saveAll");
  btn.disabled = true;

  for(let i = 0; i < n; i++){
    btn.textContent = `저장 중 (${i+1}/${n}) · ${i+1}번 장...`;
    download(snapBlobs[i], fname(i, n));
    
    // 크롬 팝업 "허용"을 누를 수 있도록 1번 이미지 직후에만 1.5초를 더 기다려줍니다.
    if(i === 0) await new Promise(r=>setTimeout(r, delayMs + 1500));
    else if(i < n - 1) await new Promise(r=>setTimeout(r, delayMs));
  }

  btn.textContent = `총 ${n}장 저장 완료!`;
  setTimeout(()=>{
    btn.textContent = `모두 저장 (${blobs.length}장)`;
  }, 2500);

  btn.disabled = false;
  saving = false;
};

$("shareAll").onclick = async ()=>{
  if(!blobs.length) return;
  const snapBlobs = [...blobs];
  const n = snapBlobs.length;
  const baseTime = Date.now() - (n * 2000);
  const files = snapBlobs.map((b, i) => new File(
    [b],
    fname(i, n),
    {type:"image/png", lastModified: baseTime + (i * 2000)}
  ));

  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({files});
      return;
    }catch(e){
      if(e && e.name === "AbortError") return;
    }
  }
  alert("이 브라우저는 한 번에 공유를 지원하지 않습니다. '모두 저장'을 눌러주세요.");
};

function runMake(){
  const raw = parse($("src").value);
  pages = limitPages(raw);
  render();
}

$("make").onclick = runMake;

document.querySelectorAll("#alignSeg button").forEach(btn=>{
  btn.onclick = ()=>{
    textAlign = btn.dataset.val;
    setSegActive("alignSeg", textAlign);
    scheduleRender(false);
  };
});
document.querySelectorAll("#wrapSeg button").forEach(btn=>{
  btn.onclick = ()=>{
    wrapMode = btn.dataset.val;
    setSegActive("wrapSeg", wrapMode);
    scheduleRender(true);
  };
});

document.querySelectorAll("#themeList .theme-btn").forEach(btn=>{
  btn.onclick = ()=>{
    const key = btn.dataset.theme;
    setThemeChipActive(key);
    const t = THEMES[key];
    if(t){
      $("bgColor").value = t.bg;
      $("inkColor").value = t.ink;
      $("hlColor").value = t.hl;
      $("hlStyle").value = t.hlStyle;
      scheduleRender(false);
    }
  };
});

["bgColor","inkColor","hlColor"].forEach(id=>{
  $(id).oninput = ()=>{
    setThemeChipActive("custom");
    scheduleRender(false);
  };
});

[
  "font","aspectRatio","wmType","wmPos","logoShape",
  "coverCenter","pageNumStyle","hlStyle","frameStyle","topDeco"
].forEach(id=>{
  $(id).onchange = ()=> scheduleRender(false);
});

[
  "wmSize","wmAlpha","wmMargin",
  "lineHeight","padX","padY","maxFont",
  "pageNumX","pageNumY","pageNumSize","wmText"
].forEach(id=>{
  $(id).oninput = ()=> scheduleRender(false);
});

$("maxPages").oninput = ()=> scheduleRender(true);
$("splitMode").onchange = ()=>{ updateSplitUI(); scheduleRender(true); };
$("lastPageType").onchange = ()=>{ updateSplitUI(); scheduleRender(true); };
$("splitDelim").oninput = ()=>{ updateSplitUI(); scheduleRender(true); };
$("src").oninput = ()=>{ updateNumHint(); };
$("numHintBtn").onclick = ()=>{ $("splitMode").value = "number"; updateSplitUI(); runMake(); };

loadPresets();
</script>
